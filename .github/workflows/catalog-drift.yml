name: Catalog drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare weights.json bytes to upstream
        run: python3 usr/share/ubuntuai-installer/catalog_drift.py
